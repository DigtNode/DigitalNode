<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalNode - Secure Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060608;
            --bg-card: rgba(16, 14, 10, 0.85);
            --border-gold: rgba(212, 175, 55, 0.28);
            --border-gold-hover: rgba(212, 175, 55, 0.7);
            --gold-primary: #d4af37;
            --gold-light: #f7e9b0;
            --gold-dark: #8c711f;
            --text-main: #f4f4f6;
            --text-muted: #94a3b8;
            --shadow-gold: 0 0 35px rgba(212, 175, 55, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 60%),
                radial-gradient(circle at 10% 10%, rgba(10, 10, 12, 0.9) 0%, #030304 100%);
            padding: 20px;
        }

        .checkout-container {
            width: 100%;
            max-width: 520px;
            background: var(--bg-card);
            border: 1px solid var(--border-gold-hover);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), var(--shadow-gold);
            backdrop-filter: blur(20px);
        }

        .checkout-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 16px;
        }

        .logo-text {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--gold-light);
            letter-spacing: 1px;
            text-decoration: none;
        }

        .timer-box {
            font-size: 12px;
            color: var(--gold-primary);
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--border-gold);
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        h2 {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .order-details-card {
            background: rgba(6, 6, 8, 0.6);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .detail-label {
            color: var(--text-muted);
        }

        .detail-value {
            font-weight: 600;
            color: var(--text-main);
        }

        .detail-row.total {
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 10px;
            margin-top: 4px;
            font-size: 18px;
        }

        .detail-row.total .detail-value {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .form-input {
            width: 100%;
            background: rgba(6, 6, 8, 0.8);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 14px 18px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .pay-method-card {
            background: rgba(6, 6, 8, 0.6);
            border: 2px solid var(--border-gold);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s ease;
        }

        .pay-method-card.selected {
            border-color: var(--gold-primary);
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .pay-method-title {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .pay-method-desc {
            font-size: 11px;
            color: var(--text-muted);
        }

        .pay-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary), var(--gold-dark));
            color: #050505;
            font-weight: 700;
            font-family: 'Cinzel', serif;
            font-size: 16px;
            letter-spacing: 1px;
            border: none;
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.3);
        }

        .pay-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--gold-primary);
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="checkout-header">
            <a href="index.html" class="logo-text">DigitalNode</a>
            <div class="timer-box" id="timer">Price reserved: 02:00:00</div>
        </div>

        <h2>Complete Your Order</h2>

        <div class="order-details-card">
            <div class="detail-row">
                <span class="detail-label">Order Reference:</span>
                <span class="detail-value" id="ordRef">#--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Realm & Faction:</span>
                <span class="detail-value" id="ordServer">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Gold Amount:</span>
                <span class="detail-value" id="ordAmount">--</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Character Nick:</span>
                <span class="detail-value" id="ordNick">--</span>
            </div>
            <div class="detail-row total">
                <span class="detail-label">Total to Pay:</span>
                <span class="detail-value" id="ordTotal">$0.00</span>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Email Address (for receipt & updates)</label>
            <input type="email" id="userEmail" class="form-input" placeholder="your.email@example.com" required>
        </div>

        <div class="form-group">
            <label class="form-label">Select Payment Method</label>
            <div class="payment-methods">
                <div class="pay-method-card selected" id="methodCard" onclick="selectMethod('card')">
                    <div class="pay-method-title">Bank Card / Apple Pay</div>
                    <div class="pay-method-desc">Via Dodo Payments</div>
                </div>
                <div class="pay-method-card" id="methodCrypto" onclick="selectMethod('crypto')">
                    <div class="pay-method-title">Cryptocurrency</div>
                    <div class="pay-method-desc">USDT, TON, BTC, SOL</div>
                </div>
            </div>
        </div>

        <button class="pay-btn" id="payNowBtn">Pay Now</button>

        <a href="index.html" class="back-link">&larr; Return to Store</a>
    </div>

    <script>
        // Получаем параметры из URL
        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get('ref') || 'ord_123456';
        const server = urlParams.get('server') || 'PvP - Horde [US]';
        const amount = urlParams.get('amount') || '50';
        const nick = urlParams.get('nick') || 'Player';
        const total = urlParams.get('total') || '10.00';

        // Заполняем данные на странице
        document.getElementById('ordRef').textContent = '#' + ref.toUpperCase();
        document.getElementById('ordServer').textContent = server;
        document.getElementById('ordAmount').textContent = amount + ' Gold';
        document.getElementById('ordNick').textContent = nick;
        document.getElementById('ordTotal').textContent = '$' + total;

        // Выбор метода оплаты
        let selectedPayment = 'card';
        function selectMethod(method) {
            selectedPayment = method;
            if (method === 'card') {
                document.getElementById('methodCard').classList.add('selected');
                document.getElementById('methodCrypto').classList.remove('selected');
            } else {
                document.getElementById('methodCrypto').classList.add('selected');
                document.getElementById('methodCard').classList.remove('selected');
            }
        }

        // Таймер обратного отсчета на 2 часа (резерв цены)
        let timeRemaining = 2 * 60 * 60; // 2 часа в секундах
        const timerEl = document.getElementById('timer');

        function updateTimer() {
            const hours = Math.floor(timeRemaining / 3600);
            const minutes = Math.floor((timeRemaining % 3600) / 60);
            const seconds = timeRemaining % 60;

            timerEl.textContent = `Price reserved: ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (timeRemaining > 0) {
                timeRemaining--;
            } else {
                timerEl.textContent = 'Price reservation expired!';
            }
        }

        setInterval(updateTimer, 1000);
        updateTimer();

        // Кнопка оплаты
        document.getElementById('payNowBtn').addEventListener('click', () => {
            const email = document.getElementById('userEmail').value.trim();
            if (!email || !email.includes('@')) {
                alert('Please enter a valid email address.');
                document.getElementById('userEmail').focus();
                return;
            }

            if (selectedPayment === 'card') {
                alert(`Redirecting to Dodo Payments secure gateway for order #${ref.toUpperCase()}...\nEmail: ${email}`);
                // Здесь в будущем будет подключение ссылки или API Dodo Payments
            } else {
                alert(`Generating cryptocurrency invoice (USDT/TON/SOL) for order #${ref.toUpperCase()}...\nEmail: ${email}`);
                // Здесь в будущем будет подключение крипто-процессинга
            }
        });
    </script>
</body>
</html>
