name: Update Prices

on:
  schedule:
    - cron: '0 * * * *' # Запуск каждый час
  workflow_dispatch: # Кнопка ручного запуска в интерфейсе GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Fetch prices from VPS
        run: |
          # Запрос к вашему VPS напрямую за актуальным JSON с ценами
          curl -s "http://162.35.30.239:8000/api/prices" > prices.json
        continue-on-error: true

      - name: Commit and push if prices changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: prices.json
          commit_message: 'Auto-update prices data from VPS'
